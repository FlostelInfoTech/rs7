<?xml version="1.0" encoding="UTF-8"?>
<!--
  FLOSTEL INFOTECH LLP — Brand Logo (Orbital Mark)

  Family meaning:
    Core (blue-teal)   — Alex (founder, centre)
    Teal dot           — Flora (elder daughter), on blue ring +38°
    Gold diamond       — Stella (younger daughter), on teal ring -38°
    Rose ring          — Cathy (wife), at lower crossing of both orbits
    Crossing orbits    — FS initials; both daughters paths meet at Cathy
    Outer dashed ring  — precision, technology

  Node positions (viewBox 400x400, centre 200,200):
    Flora  (116, 96)   blue ring +38 t=210
    Stella (284, 96)   teal ring -38 t=330
    Cathy  (201, 274)  lower ellipse crossing
    Alex   (200, 200)  centre core
-->
<svg xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 400 400" width="400" height="400"
  role="img" aria-label="Flostel orbital mark">
  <defs>
    <linearGradient id="gCore" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="gDot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="gStar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="gCathy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fda4af"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <clipPath id="circle"><circle cx="200" cy="200" r="192"/></clipPath>
  </defs>
  <circle cx="200" cy="200" r="200" fill="#0f172a"/>
  <circle cx="200" cy="200" r="198" fill="none" stroke="#1e3a5f" stroke-width="1.5" opacity="0.6"/>
  <g clip-path="url(#circle)">
    <circle cx="200" cy="200" r="172" fill="none" stroke="#1e4a44" stroke-width="1.2" stroke-dasharray="4 7" opacity="0.6"/>
    <ellipse cx="200" cy="200" rx="150" ry="61" fill="none" stroke="#2dd4bf" stroke-width="3.4" opacity="0.55" transform="rotate(-38,200,200)"/>
    <ellipse cx="200" cy="200" rx="150" ry="61" fill="none" stroke="#38bdf8" stroke-width="3.4" opacity="0.55" transform="rotate(38,200,200)"/>
    <circle cx="200" cy="200" r="54" fill="#0d9488" opacity="0.10"/>
    <circle cx="200" cy="200" r="38" fill="#0d9488" opacity="0.12"/>
    <circle cx="200" cy="200" r="27" fill="url(#gCore)"/>
    <circle cx="200" cy="200" r="13" fill="#bfdbfe" opacity="0.90"/>
    <line x1="200" y1="200" x2="116" y2="96" stroke="#2dd4bf" stroke-width="1" stroke-dasharray="3 5" opacity="0.30"/>
    <line x1="200" y1="200" x2="284" y2="96" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3 5" opacity="0.30"/>
    <line x1="200" y1="200" x2="201" y2="274" stroke="#fda4af" stroke-width="1" stroke-dasharray="3 5" opacity="0.28"/>
    <circle cx="116" cy="96" r="38" fill="#2dd4bf" opacity="0.12"/>
    <circle cx="116" cy="96" r="19" fill="url(#gDot)"/>
    <circle cx="116" cy="96" r="8" fill="#f0fdfa" opacity="0.85"/>
    <circle cx="284" cy="96" r="39" fill="#f59e0b" opacity="0.12"/>
    <polygon points="284,71 309,96 284,121 259,96" fill="url(#gStar)"/>
    <polygon points="284,84 297,96 284,108 271,96" fill="#fefce8" opacity="0.55"/>
    <circle cx="201" cy="274" r="42" fill="#e11d48" opacity="0.09"/>
    <circle cx="201" cy="274" r="18" fill="none" stroke="url(#gCathy)" stroke-width="5.8" opacity="0.95"/>
    <circle cx="201" cy="274" r="5" fill="#fda4af" opacity="0.88"/>
  </g>
</svg>
