[package]
name = "rs7-testpanel"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "GUI Test Panel for RS7 HL7 Library - demonstrates parsing, building, validation, MLLP, and FHIR conversion"
keywords = ["hl7", "healthcare", "gui", "test-panel"]
categories = ["gui", "development-tools::testing"]

[dependencies]
# GUI framework
eframe = "0.33"
egui = "0.33"
egui_extras = { version = "0.33", features = ["syntect"] }

# RS7 crates
rs7-core = { path = "../rs7-core" }
rs7-parser = { path = "../rs7-parser" }
rs7-terser = { path = "../rs7-terser" }
rs7-validator = { path = "../rs7-validator" }
rs7-fhir = { path = "../rs7-fhir" }
rs7-mllp = { path = "../rs7-mllp" }
rs7-http = { path = "../rs7-http", features = ["auth"] }
rs7-xml = { path = "../rs7-xml" }

# Async runtime for MLLP/HTTP/FTP
tokio = { version = "1.48", features = [
    "rt-multi-thread",
    "sync",
    "time",
    "macros",
    "net",
    "io-util",
] }

# FTP Client/Server support
suppaftp = { version = "7", features = ["tokio"] }
libunftp = "0.20"  # Must match unftp-sbe-fs dependency
unftp-sbe-fs = "0.2"

# SFTP Client/Server support (via SSH)
ssh2 = "0.9"  # For SFTP client (sync, wrapped with spawn_blocking)
russh = "0.50"  # For SFTP server (async)
russh-sftp = "2.1"
russh-keys = "0.50.0-beta.7"
async-trait = "0.1"
futures = "0.3"
glob = "0.3"  # For file pattern matching
rand = "0.8"  # For key generation (compatible with russh-keys rand_core 0.6)

# DICOM support
dicom-core = "0.9"
dicom-object = "0.9"
dicom-ul = "0.9"
dicom-encoding = "0.9"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# File dialogs
rfd = "0.16"

# HTTP client with TLS support
reqwest = { version = "0.12", features = ["rustls-tls", "json"] }

# Utilities
chrono = "0.4"
uuid = { version = "1.19", features = ["v4"] }
env_logger = "0.11"
log = "0.4"
once_cell = "1.21"
base64 = "0.22"

# SVG rendering for logo
resvg = "0.45"
usvg = "0.45"
tiny-skia = "0.11"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
resvg = "0.45"
usvg = "0.45"
tiny-skia = "0.11"

[features]
default = []

[[bin]]
name = "rs7-testpanel"
path = "src/main.rs"
